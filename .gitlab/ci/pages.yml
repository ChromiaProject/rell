# GitLab Pages deployments: only the static portal index (`pages:index`) still publishes to
# GitLab Pages. The five manual report jobs (docs / benchmarks / profile / lsp / regression) used
# to each mint a per-commit, never-expiring GitLab Pages "parallel deployment" via `pages:
# path_prefix`. That quota (parallel deployment slots) is capped per *root-level namespace* — i.e.
# shared across every project under the `chromaway` group, not just this one — so an unbounded,
# never-expiring accumulation here could starve Pages deployments in sibling projects. New runs of
# these jobs now publish their HTML report as a plain job artifact instead (browsable via
# `$CI_JOB_URL/artifacts/file/...`), consuming no Pages deployment slots at all. Reports already
# published under `$CI_PAGES_URL` from before this change are untouched and keep resolving —
# GitLab Pages deployments are not deleted or re-expired retroactively. The portal index below
# still discovers new runs too — via the Jobs API instead of the Environments API — so it isn't
# frozen, it just no longer costs a Pages slot per run.

# Client-side portal index listing recent `pages:docs` / `pages:benchmarks` / `pages:profile` /
# `pages:lsp` / `pages:regression` runs, plus a profile-diff tool. Two sources feed it, per the
# file-level comment above: historical GitLab Pages deployments (from before those jobs moved off
# Pages) via the Environments API, and current job-artifact runs via the Jobs API (bounded to the
# most recent pages of job history — see `JOB_SCAN_PAGES` in build-index.sh). Both APIs require
# authentication even on public projects, and job artifacts additionally require authentication to
# fetch on this private project — build-index.sh bakes the merged list into `manifest.json` at
# publish time via `glab api`, and the app fetches that + per-deployment /data/main.json from the
# browser; clicking through to a job-artifact link still requires the viewer to be logged into
# GitLab with project access, unlike the old anonymously-served Pages links.
#
# Requires GITLAB_TOKEN (project access token with `read_api`, masked + dev-branch-protected).
# CI_JOB_TOKEN's allowlist excludes the Environments/Jobs API, so it 403s.
#
# Restricted to dev and version-* release branches so feature branches can't overwrite the root
# deployment.
.pages-index:
  image: registry.gitlab.com/gitlab-org/cli:v1.110.0@sha256:72e1006c314ffa626419c1e00fbe2e6450948354b23a0e9e7c9880e4e5e2cde1
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH =~ /^version-[0-9]+[.][0-9]+([.][0-9]+)?$/
  script:
    - apk add --no-cache jq curl
    - mkdir -p public
    - performance/ci-index/build-index.sh public
  pages: true
  environment:
    name: pages-index
    url: "$CI_PAGES_URL/"
  artifacts:
    paths: [ public ]
    expire_in: 30 days

pages:index:
  extends: .pages-index
  stage: deploy
  needs: []

# MR counterpart of the old `pages:index:after-*` republish jobs: branch pipelines (dev /
# version-*) refresh the root index, but MR pipelines have no index — instead they post the
# freshly published links as a note on the merge request. One follow-up per portal kind, each
# triggered by `needs:` on its manual job and inheriting that job's links via the dotenv artifact
# (`mr-comment.env`). post-mr-comment.sh
# upserts a single note (creating it once, then editing it as more kinds are run or a kind is
# re-run), so repeated dispatches never stack duplicate comments. The shared per-MR `resource_group`
# serialises these read-modify-write cycles so concurrent dispatches can't race.
#
# Auth is PORTAL_GITLAB_TOKEN — a dedicated `rell-portal-ci` project access token (api scope,
# Reporter) so the note is authored by its own bot instead of the `qodana-ci` one. Like that token it
# must be unprotected to be exposed on MR/feature branches; its `api` scope allows writing notes.
.pages-mr-comment:
  image: registry.gitlab.com/gitlab-org/cli:v1.110.0@sha256:72e1006c314ffa626419c1e00fbe2e6450948354b23a0e9e7c9880e4e5e2cde1
  stage: index
  interruptible: true
  resource_group: "portal-mr-comment-$CI_MERGE_REQUEST_IID"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - apk add --no-cache jq curl
    - performance/ci-index/post-mr-comment.sh

pages:mr-comment:after-bench:
  extends: .pages-mr-comment
  needs:
    - job: pages:benchmarks
      artifacts: true

pages:mr-comment:after-profile:
  extends: .pages-mr-comment
  needs:
    - job: pages:profile
      artifacts: true

pages:mr-comment:after-lsp:
  extends: .pages-mr-comment
  needs:
    - job: pages:lsp
      artifacts: true

pages:mr-comment:after-regression:
  extends: .pages-mr-comment
  needs:
    - job: pages:regression
      artifacts: true

pages:mr-comment:after-docs:
  extends: .pages-mr-comment
  needs:
    - job: pages:docs
      artifacts: true

# Manual benchmark run publishing its HTML report as a plain job artifact (not GitLab Pages —
# see the file-level comment above); including the short SHA in the artifact/portal links lets
# same-branch reruns be told apart for diffing. Benchmark JSON is also exposed at /data/main.json
# so external tooling can fetch raw scores without scraping HTML.
pages:benchmarks:
  stage: portal
  tags: [ saas-linux-medium-amd64 ]
  interruptible: true
  rules:
    - when: manual
      allow_failure: true
  needs: []
  script:
    - ./gradlew $GRADLE_FLAGS_MEDIUM :performance:mainBenchmark
    - mkdir -p public public/data
    - cp -r performance/build/reports/benchmarks/html/. public/
    # Publish the raw kotlinx-benchmark JSON alongside the HTML for programmatic ingest
    # (commit-to-commit regression diffs). Plugin writes to reports/benchmarks/main/<ts>/main.json;
    # pick the newest and expose it at the stable URL `<deployment>/data/main.json`.
    - |
      latest_json=$(find performance/build/reports/benchmarks/main -type f -name '*.json' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
      if [ -z "$latest_json" ]; then
        echo "ERROR: no benchmark JSON found under performance/build/reports/benchmarks/main" >&2
        exit 1
      fi
      cp "$latest_json" public/data/main.json
      echo "Published $latest_json -> public/data/main.json"
    - echo "Benchmark report - $CI_JOB_URL/artifacts/file/public/report.html"
    - echo "Benchmark JSON   - $CI_JOB_URL/artifacts/file/public/data/main.json"
    # Hand the portal links to the MR-comment follow-up (consumed via dotenv on MR pipelines).
    - |
      {
        echo "PORTAL_KEY=benchmarks"
        echo "PORTAL_BULLET=**Benchmarks** (\`$CI_COMMIT_SHORT_SHA\`): [report]($CI_JOB_URL/artifacts/file/public/report.html), [JSON]($CI_JOB_URL/artifacts/file/public/data/main.json)"
      } > mr-comment.env
  artifacts:
    paths: [ public ]
    reports:
      dotenv: mr-comment.env
    expire_in: 30 days

# Manual end-to-end profiler (Postgres + chr node + async-profiler + workload + HTML).
# Extends `.local-chr-cache` for the DIND Postgres wiring and the persistent .m2 cache.
pages:profile:
  extends: .local-chr-cache
  stage: portal
  tags: [ saas-linux-medium-amd64 ]
  interruptible: true
  rules:
    - when: manual
      allow_failure: true
  needs: []
  script:
    - ./gradlew $GRADLE_FLAGS_MEDIUM :performance:profile
    - mkdir -p public
    - cp -r performance/reports/. public/
    - echo "Profile report - $CI_JOB_URL/artifacts/file/public/report.html"
    # Hand the portal links to the MR-comment follow-up (consumed via dotenv on MR pipelines).
    - |
      {
        echo "PORTAL_KEY=profile"
        echo "PORTAL_BULLET=**Profile** (\`$CI_COMMIT_SHORT_SHA\`): [report]($CI_JOB_URL/artifacts/file/public/report.html)"
      } > mr-comment.env
  artifacts:
    when: always
    paths: [ public ]
    reports:
      dotenv: mr-comment.env
    expire_in: 30 days

# Manual language-server startup profiler: two profiled child-JVM LSP sessions (cold and hot index
# cache) against the in-repo `alice-mysterious-seed` workspace, rendered to HTML.
#
# Deliberately not extending `.setup` / `.local-chr-cache`: `:performance:profileLsp` needs neither
# PostgreSQL nor Docker nor a chr build — just the language-server shadow JAR and a workspace that
# ships with the repo.
#
# Only `report.html` and the two flame graphs it iframes are published to `public/`; the rest of
# the run directory (JFR recordings, collapsed stacks, and the `cache-home/` index cache the cold
# run persists for the hot run) is kept as separate job artifact paths for debugging.
pages:lsp:
  stage: portal
  tags: [ saas-linux-medium-amd64 ]
  interruptible: true
  rules:
    - when: manual
      allow_failure: true
  needs: []
  before_script:
    - !reference [ .setup-fragments, develocity-inject ]
  script:
    - ./gradlew $GRADLE_FLAGS_MEDIUM :performance:profileLsp
    - mkdir -p public
    - cp performance/reports/lsp-startup/report.html performance/reports/lsp-startup/flamegraph-*.html public/
    - echo "LSP startup report - $CI_JOB_URL/artifacts/file/public/report.html"
    # Hand the portal links to the MR-comment follow-up (consumed via dotenv on MR pipelines).
    - |
      {
        echo "PORTAL_KEY=lsp"
        echo "PORTAL_BULLET=**LSP startup** (\`$CI_COMMIT_SHORT_SHA\`): [report]($CI_JOB_URL/artifacts/file/public/report.html)"
      } > mr-comment.env
  artifacts:
    when: always
    paths:
      - public
      - performance/reports/lsp-startup/milestones-*.json
      - performance/reports/lsp-startup/system-info.json
      - performance/reports/lsp-startup/server-stderr-*.log
    reports:
      dotenv: mr-comment.env
    expire_in: 30 days

# Manual regression toolkit: clone every public Rell project and verify the local build compiles
# (and tests) them. Off the default pipeline — full runs take tens of minutes. Public-only flavour
# wired here; `private.json` is gitignored and never reaches the runner.
#
# On saas-linux-xlarge-amd64 (16c/64G): one JUnit test JVM runs the @TestFactory in
# regression/test/regression/RegressionTest.kt; (project, backend) parallelism is JUnit Jupiter's
# job, capped at `regressionParallelism` (8 here). Each (project, backend) unit operates on its
# own working copy under `workdir/<project>-<backend>/` (mirrored from the master clone by
# `refreshBackendCopy` in regression/src/regression/compile.kt), so concurrent `chr install`
# calls never race on the shared `src/lib/<name>` clone tree. chr itself runs out-of-process via
# ProcessBuilder, so the ~2.5 GB chr JVM is *outside* the test JVM's heap budget. Each unit also
# leases its own throw-away Testcontainers Postgres for the duration of its pipeline
# (`withProjectPostgres`).
#
# Peak per slot ≈ 2.5 GB chr subprocess + 1.2 GB Postgres container (process + 1 GB tmpfs cap,
# lazy fill) ≈ 3.7 GB OS-level. 8 slots ≈ 30 GB + 4 GB test JVM heap + 4 GB Gradle daemon +
# ~6 GB OS/DIND/non-heap ≈ 44 GB, comfortably under the xlarge envelope. (`--max-workers=8` from
# $GRADLE_FLAGS_XLARGE is unused by the regression Test task itself — fan-out is JUnit's — but
# the up-front `:performance:buildLocalChr` task graph still benefits.)
#
# Extends `.local-chr-cache-no-postgres`: the regression toolkit brings its own per-project
# Postgres, so the shared DIND instance from `.setup` would just sit idle.
# `expectedFailure: true` projects in public.json aren't regressions; `ignoreFailures = true` on
# the regression Test task already keeps a single compile blowup off the build status, and
# `allow_failure: true` here is belt-and-braces.
pages:regression:
  extends: .local-chr-cache-no-postgres
  stage: portal
  tags: [ saas-linux-xlarge-amd64 ]
  interruptible: true
  rules:
    - when: manual
      allow_failure: true
  needs: []
  script:
    - ./gradlew $GRADLE_FLAGS_XLARGE -PregressionParallelism=8 :regression:regressionPublic
    - mkdir -p public
    - cp -r regression/reports/. public/
    - echo "Regression report - $CI_JOB_URL/artifacts/file/public/report.html"
    - echo "Regression JSON   - $CI_JOB_URL/artifacts/file/public/results.json"
    # Hand the portal links to the MR-comment follow-up (consumed via dotenv on MR pipelines).
    - |
      {
        echo "PORTAL_KEY=regression"
        echo "PORTAL_BULLET=**Regression** (\`$CI_COMMIT_SHORT_SHA\`): [report]($CI_JOB_URL/artifacts/file/public/report.html), [JSON]($CI_JOB_URL/artifacts/file/public/results.json)"
      } > mr-comment.env
  artifacts:
    when: always
    paths: [ public ]
    reports:
      dotenv: mr-comment.env
    expire_in: 30 days

# Manual Rell stdlib documentation publish: build local chr against the snapshot Rell, then run
# `chr generate docs-site --system` (the chromia-build-tools docs entrypoint that drives the
# rell-dokka-plugin against the bundled stdlib). HTML is published as a job artifact, entry point
# `index.html` (Dokka's landing page). Mirrors `work/build-local-docs.sh` end-to-end.
#
# Extends `.local-chr-cache-no-postgres`: docs generation is pure Dokka, no Postgres needed; we
# still want the persistent ~/.m2 + chromia-cli-local cache so reruns skip the chr rebuild.
pages:docs:
  extends: .local-chr-cache-no-postgres
  stage: portal
  tags: [ saas-linux-medium-amd64 ]
  interruptible: true
  rules:
    - when: manual
      allow_failure: true
  needs: []
  script:
    - ./gradlew $GRADLE_FLAGS_MEDIUM :performance:buildLocalChr
    - mkdir -p public
    # `--enable-native-access=ALL-UNNAMED` mirrors work/build-local-docs.sh — chr's JVM startup
    # logs Foreign API warnings without it. JAVA_ARGS is forwarded by the chr launcher.
    - |
      JAVA_ARGS="${JAVA_ARGS:-} --enable-native-access=ALL-UNNAMED" \
        chromia-cli-local/chromia-cli/target/chromia-cli-dev-dist/bin/chr generate docs-site --system -d public
    - echo "Rell docs - $CI_JOB_URL/artifacts/file/public/index.html"
    # Hand the portal links to the MR-comment follow-up (consumed via dotenv on MR pipelines).
    - |
      {
        echo "PORTAL_KEY=docs"
        echo "PORTAL_BULLET=**Docs** (\`$CI_COMMIT_SHORT_SHA\`): [docs]($CI_JOB_URL/artifacts/file/public/index.html)"
      } > mr-comment.env
  artifacts:
    paths: [ public ]
    reports:
      dotenv: mr-comment.env
    expire_in: 30 days
