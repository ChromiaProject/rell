# OWASP Dependency-Check aggregate report. Opt-in via the `RUN_DEPENDENCY_CHECK=true` pipeline
# variable; runs on the medium runner because the heavy work is downloading NVD feeds, not
# parallel test execution.
#
# Requires the `NVD_API_KEY` CI/CD variable to be set (Settings → CI/CD → Variables; mark it
# Masked and Protected). Without a key the NIST API rate-limits the job into HTTP 429 within a
# few minutes and `dependencyCheckAggregate` fails with "Error updating the NVD Data".
# Request a key at https://nvd.nist.gov/developers/request-an-api-key. The key is consumed by
# build.gradle.kts via `providers.environmentVariable("NVD_API_KEY")`.

dependency-check:
  extends: .setup
  stage: dependency-check
  tags: [ saas-linux-medium-amd64 ]
  interruptible: true
  # The NVD API is frequently flaky — transient HTTP 503/429 responses abort the data update
  # (and leave the H2 cache mid-compaction, surfacing as an org.h2.mvstore ClosedChannelException
  # cascade). dependency-check treats a failed update as fatal by design (stale vuln data is
  # unsafe), so the only resilient option is to re-run and let a later attempt catch NVD healthy.
  retry:
    max: 2
    when: script_failure
  rules:
    - if: $RUN_DEPENDENCY_CHECK == "true"
  # --no-parallel: dependencyCheckAggregate resolves every subproject's configurations from the
  # root project. With org.gradle.parallel=true (gradle.properties), Gradle 9 rejects that
  # cross-project resolution ("attempted without an exclusive lock").
  script: [ "./gradlew $GRADLE_FLAGS_MEDIUM --no-configuration-cache --no-parallel dependencyCheckAggregate" ]
  artifacts:
    when: always
    paths: [ build/reports/dependency-check-report.* ]
