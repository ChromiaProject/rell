version: "1.0"

# Pinned to match .gitlab-ci.yml (only used for local runs — in CI the job runs inside
# this image and qodana picks up the bundled IDE via QODANA_DIST)
linter: jetbrains/qodana-jvm-community:2026.1

profile:
  name: qodana.recommended
  inspections:
    - inspection: UnusedImport
      severity: INFO
    - inspection: ClassName
      enabled: false
    - inspection: PrivatePropertyName
      enabled: false
    - inspection: FunctionName
      enabled: false
    - inspection: LocalVariableNamingConvention
      enabled: false
    - inspection: LocalVariableName
      enabled: false
    - inspection: DuplicatedCode
      enabled: false

# Exclude build output and Gradle/IDE caches from all inspections. The `build` entry also covers ANTLR-generated Java.
exclude:
  - name: All
    paths:
      - build
      - .gradle
