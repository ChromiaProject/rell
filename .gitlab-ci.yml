# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
image: container-registry.oracle.com/graalvm/jdk:21
include:
- component: "$CI_SERVER_FQDN/qodana/qodana/qodana-gitlab-ci@v2025.3"
  inputs:
    stage: qodana
    args: "--image,jetbrains/qodana-jvm-community:2025.3"
- local: ".gitlab/ci/templates.yml"
- local: ".gitlab/ci/build.yml"
- local: ".gitlab/ci/dependency-check.yml"
- local: ".gitlab/ci/pages.yml"
- local: ".gitlab/ci/qodana.yml"
- template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
stages:
- build
- deploy
- dependency-check
- qodana
- portal
- index
- test
workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH
      =~ /^version-[0-9]+[.][0-9]+([.][0-9]+)?$/
variables:
  PUBLISH_BUILD_SCAN:
    value: 'false'
    description: Set to 'true' to publish a Develocity build scan for this pipeline
      (visible at scans.gradle.com).
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_FLAGS_XLARGE: "-Dorg.gradle.caching=true --max-workers=8 -Dorg.gradle.jvmargs=-Xmx12g
    -Pkotlin.daemon.jvmargs=-Xmx6g -PtestJvmMaxHeap=4g -PjunitParallelThreads=4 -PgitlabAuthHeaderValue=$CI_JOB_TOKEN"
  GRADLE_FLAGS_MEDIUM: "-Dorg.gradle.caching=true --max-workers=1 -Dorg.gradle.jvmargs=-Xmx4g
    -Pkotlin.daemon.jvmargs=-Xmx2g -PtestJvmMaxHeap=4g -PjunitParallelThreads=2 -PgitlabAuthHeaderValue=$CI_JOB_TOKEN"
  POSTCHAIN_DB_URL: jdbc:postgresql://docker/postchain
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ''
  TESTCONTAINERS_HOST_OVERRIDE: docker
  TESTCONTAINERS_RYUK_DISABLED: 'true'
  JACOCO_REPORT_DIR: coverage-report-aggregate/build/reports/jacoco/testCodeCoverageReport
services:
- name: docker:28-dind
  alias: docker
  command:
  - "--tls=false"
cache:
  key: "$CI_COMMIT_REF_SLUG"
  fallback_keys:
  - dev
  paths:
  - ".gradle"
  policy: pull-push
